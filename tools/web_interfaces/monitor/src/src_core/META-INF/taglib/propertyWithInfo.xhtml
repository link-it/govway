<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:ui="http://java.sun.com/jsf/facelets"
                 xmlns:h="http://java.sun.com/jsf/html"
                 xmlns:f="http://java.sun.com/jsf/core"
                 xmlns:c="http://java.sun.com/jstl/core"
                 xmlns:a4j="http://richfaces.org/a4j"
                 xmlns:link="http://www.link.it">
	<c:if test="#{empty required}">
	 	<c:set var="required" value="false"/>
	</c:if>
	<c:if test="#{empty noteEscape}">
	 	<c:set var="noteEscape" value="true"/>
	</c:if>
	<c:if test="#{empty id}">
		<c:set var="id" value="propWithInfo" />
	</c:if>
		
    <a4j:outputPanel rendered="#{not empty rendered ? rendered : true}" layout="block" id="#{id}_prop_pnl">
    	<div class="prop">
    		<c:if test="#{not empty labelId}">
				<h:outputLabel id="#{labelId}" styleClass="#{not empty styleClass ? styleClass : ''}">
					<h:outputText value="#{label}" />
					<c:if test="#{required}">
						<em>*</em>
					</c:if>
				</h:outputLabel>
			</c:if>
			<c:if test="#{empty labelId}">
				<h:outputLabel styleClass="#{not empty styleClass ? styleClass : ''}">
					<h:outputText value="#{label}" />
					<c:if test="#{required}">
						<em>*</em>
					</c:if>
				</h:outputLabel>
			</c:if>	
			<div class="boxInfoDiv">
				<ui:insert/>
				<c:if test="#{not empty dialogInfo}">
					<div class="iconInfoBox" id="#{id}_divIconInfo">
				      	<!-- comando reso con la sola icona: ruolo, posizione nel Tab e nome, così la finestra informativa si apre anche da tastiera -->
				      	<span class="spanIconInfoBox" id="#{id}_spanIconInfo" role="button" tabindex="0" aria-haspopup="dialog"
				      		aria-label="#{not empty dialogInfo.headerFinestraModale ? dialogInfo.headerFinestraModale : 'Informazioni'}">
							<i class="material-icons md-24" id="#{id}_icon" aria-hidden="true">#{dialogInfo.buttonIcon}</i>
						</span>
						<script type="text/javascript" nonce="#{_csp_random_nonce}">
							jQuery(document).ready(function() {
								#{id}_dialogInfo_hiddenBody_ctn = jQuery("##{id}_dialogInfo_hiddenBody").val();
								jQuery("##{id}_dialogInfo_hiddenBody").val('');
								jQuery("##{id}_spanIconInfo").click(function(){
									jQuery("##{id}_dialogInfo_ModalBody").html(#{id}_dialogInfo_hiddenBody_ctn);
									Richfaces.showModalPanel('#{id}_dialogInfo_Modal');
				    			});
								jQuery("##{id}_spanIconInfo").keydown(function(evento){
									if(evento.which === 13 || evento.which === 32){
										evento.preventDefault();
										jQuery(this).click();
									}
				    			});
							 });
						</script>
						<link:dialogInfo id="#{id}_dialogInfo" dialogInfo="#{dialogInfo}" />
					</div>
				</c:if>
			</div>
			<c:if test="#{not empty note}">
				<p class="note">
					<h:outputText value="#{note}" escape="#{noteEscape}"/>
				</p>
			</c:if>
		</div>
    </a4j:outputPanel>
</ui:composition>
