<ui:composition  xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:ui="http://java.sun.com/jsf/facelets"
                 xmlns:h="http://java.sun.com/jsf/html"
                 xmlns:f="http://java.sun.com/jsf/core"
                 xmlns:c="http://java.sun.com/jstl/core"
                 xmlns:a4j="http://richfaces.org/a4j">
	<c:if test="#{empty required}">
	 	<c:set var="required" value="false"/>
	</c:if>
	<c:if test="#{empty noteEscape}">
	 	<c:set var="noteEscape" value="true"/>
	</c:if>
    <a4j:outputPanel rendered="#{not empty rendered ? rendered : true}" layout="block">
    	<div class="prop">
    		<c:if test="#{not empty labelId}">
				<h:outputLabel id="#{labelId}" styleClass="#{not empty styleClass ? styleClass : ''}">
					<h:outputText value="#{label}" />
					<c:if test="#{required}">
						<em>*</em>
					</c:if>
				</h:outputLabel>
			</c:if>
			<!-- etichetta di solo spazio (label="&amp;#160;" o label=" "): serve ad allineare il contenuto, non etichetta un campo.
			     Distanziatore nascosto ai lettori di schermo, che il CSS impagina come un'etichetta (span.labelSpacer).
			     Il nome del campo accanto viene da altro (es. le combo 'Numero Dimensioni' sono nominate da utils.js) -->
			<c:if test="#{empty labelId and (label eq '&#160;' or label eq ' ')}">
				<span class="labelSpacer #{not empty styleClass ? styleClass : ''}" aria-hidden="true"><h:outputText value="#{label}" /><c:if test="#{required}"><em>*</em></c:if></span>
			</c:if>
			<c:if test="#{empty labelId and label ne '&#160;' and label ne ' '}">
				<h:outputLabel styleClass="#{not empty styleClass ? styleClass : ''}">
					<h:outputText value="#{label}" />
					<c:if test="#{required}">
						<em>*</em>
					</c:if>
				</h:outputLabel>
			</c:if>	
			<ui:insert/>
			<c:if test="#{not empty note}">
				<p class="note">
					<h:outputText value="#{note}" escape="#{noteEscape}"/>
				</p>
			</c:if>
		</div>
    </a4j:outputPanel>
</ui:composition>
