tools.web_interfaces.control_station.falsePositives=WJL-FP1,WJL-FP2,WCS-FP1,WCS-FP2

# 'Add "<th>" headers to this "<table>".'
# La tabella viene utilizzata per la grafica per cui l'header non può essere aggiunto

sonar.issue.ignore.multicriteria.WJL-FP1.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.WJL-FP1.resourceKey=**/*.jsp

# 'Add a description to this table.'
# La tabella viene utilizzata per la grafica per cui una descrizione non ha senso

sonar.issue.ignore.multicriteria.WJL-FP2.ruleKey=Web:TableWithoutCaptionCheck
sonar.issue.ignore.multicriteria.WJL-FP2.resourceKey=**/*.jsp

# 'Add a 'onKeyPress|onKeyDown|onKeyUp' attribute to this <...> tag.'
# Gli elementi resi comandi con role="button" e tabindex="0" (span.copy-box, span.icon-box del menù azioni, icone <i>,
# ancore di apertura delle sezioni, immagini di paginazione) sono attivabili da tastiera tramite il gestore 'keydown'
# delegato su '[role="button"][tabindex="0"]' definito in lib/js/webapps.js (Invio e barra spaziatrice emulano il clic;
# il menù azioni ha un gestore dedicato che emette il 'mousedown' atteso dal plugin jquery.context-menu).
# L'analisi statica vede solo il markup e non i gestori registrati via JavaScript. Non è possibile aggiungere
# attributi 'onkey*' in linea: la Content-Security-Policy della console ammette solo script con nonce.

sonar.issue.ignore.multicriteria.WCS-FP1.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.WCS-FP1.resourceKey=**/*.jsp

# 'Interactive elements should not be assigned non-interactive roles.'
# Le celle <td> che ricevono i ruoli di regione ('banner', 'navigation', 'main', 'contentinfo') appartengono alla
# tabella di layout della pagina, dichiarata con role="presentation": le celle non hanno quindi la semantica
# di 'cell'/'gridcell' e l'assegnazione del ruolo di regione è ARIA valida. Sonar valuta il <td> isolatamente,
# senza considerare il ruolo della tabella che lo contiene.

sonar.issue.ignore.multicriteria.WCS-FP2.ruleKey=Web:S6843
sonar.issue.ignore.multicriteria.WCS-FP2.resourceKey=**/*.jsp
