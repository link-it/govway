# =============================================================================
# GovWay - Observability
#
# Configurazione dei collettori (metrics; in futuro traces/logs).
# Un collettore e' signal-agnostic: 'type' e' comune, ogni segnale ha la sua config.
# Ridefinibile tramite 'govway_local.observability.properties'.
# =============================================================================

# Elenco dei collettori attivi (nomi separati da virgola)
# Per default nessun collettore è attivo (metriche disabilitate, endpoint '/metrics' non disponibile).
# Per abilitare l'endpoint Prometheus: observability.collectors=prometheus
observability.collectors=

# -----------------------------------------------------------------------------
# Default di segnale, validi per TUTTI i collettori (ridefinibili per collettore con
#   observability.collector.<name>.<signal>.<prop>=<value>)
# -----------------------------------------------------------------------------
observability.metrics.enabled=true
#observability.metrics.stepS=60

# Abilitazione delle metriche di sistema (binder JVM/process di default)
observability.metrics.system-metrics.enabled=true

# Bucket SLO degli istogrammi (liste separate da virgola)
observability.metrics.latency-slotMs=5,10,25,50,100,250,500,1000,2500,5000,10000
observability.metrics.size-slotByte=256,1024,4096,16384,65536,262144,1048576,4194304,16777216
# Bucket SLO (ms) per gli istogrammi di persistenza del tracciamento su DB
observability.metrics.persistence-slotMs=5,10,25,50,100,250,500,1000,2500,5000,10000

# -----------------------------------------------------------------------------
# Collettore 'prometheus' (type=prometheus: pull, metriche esposte sull'endpoint '/govway/metrics')
# -----------------------------------------------------------------------------
observability.collector.prometheus.type=prometheus

# -----------------------------------------------------------------------------
# Esempio collettore push OTLP (type=otel), encoding HTTP/protobuf:
# observability.collector.otel.type=otel
# endpoint = URL completo del receiver OTLP/HTTP, comprensivo del path (es. '/v1/metrics')
# observability.collector.otel.metrics.endpoint=http://collector:4318/v1/metrics
# observability.collector.otel.metrics.stepS=30
# Autenticazione Basic verso il collector (opzionale): se presenti, viene inviato
# l'header 'Authorization: Basic <base64(username:password)>'
# observability.collector.otel.metrics.credential.username=user
# observability.collector.otel.metrics.credential.password=secret
# Attributi di risorsa con cui GovWay si presenta al collector (opzionali, comuni a tutti i segnali):
# - service.name: per default 'govway'
# - service.version: per default la versione di GovWay
# - service.instance.id: per default il cluster id del nodo (org.openspcoop2.pdd.cluster_id) o, se non definito, l'hostname
# observability.collector.otel.resource.service.name=govway
# observability.collector.otel.resource.service.version=1.0
# observability.collector.otel.resource.service.instance.id=${HOSTNAME}
# I valori possono riferire variabili di sistema o java tramite la sintassi ${NOME}.
# -----------------------------------------------------------------------------
