ignore:
  #- vulnerability: "CVE-??"
  #- package:
  #    name: "??"

  # Librerie Jackson incluse ('shaded') in hazelcast-5.7.0.jar (com/hazelcast/shaded/...):
  # jackson-core e jackson-databind 2.21.2 (com.fasterxml.jackson.core) e 3.1.2 (tools.jackson.core).
  # Falsi positivi: jackson-core/jackson-databind 2.21.2 e jackson-databind 3.1.2 non sono referenziate da alcuna classe
  # di Hazelcast (bytecode non raggiungibile); jackson-core 3.1.2 e' usata da Hazelcast solo per valori HazelcastJsonValue,
  # query su JSON e Jet, funzionalita' non utilizzate da GovWay. Il jackson utilizzato da GovWay (2.22.3) non e' affetto.
  # Documentazione completa:
  # resources/doc/src/manuali/vulnerability-management/falsePositive/34x/hazelcast.rst

  # GHSA-7hhh-6rmp-j9qf / CVE-2026-89425 (jackson-core: UTF8DataInputJsonParser._reportInvalidToken() missing maxErrorTokenLength limit, HIGH)
  - vulnerability: "GHSA-7hhh-6rmp-j9qf"
    package:
      name: "jackson-core"
  - vulnerability: "CVE-2026-89425"
    package:
      name: "jackson-core"

  # GHSA-p6pp-m3f8-5c89 / CVE-2026-89407 (jackson-core: ReDoS: quadratic backtracking in NumberInput.PATTERN_FLOAT via looksLikeValidNumber(), HIGH)
