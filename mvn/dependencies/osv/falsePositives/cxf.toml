# senza distinguere la linea 3.6.x, che quindi risulta erroneamente affetta.
# Riferimenti:
# - https://cxf.apache.org/security-advisories.data/CVE-2026-49875.txt
# - https://cxf.apache.org/security-advisories.data/CVE-2026-50634.txt
#
# OWASP Suppression: mvn/dependencies/owasp/falsePositives/cxf.xml

