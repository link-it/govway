# =============================================================================
# GovWay - Observability
#
# Configurazione dei collettori (metrics; in futuro traces/logs).
# Un collettore e' signal-agnostic: 'type' e' comune, ogni segnale ha la sua config.
# Ridefinibile tramite 'govway_local.observability.properties'.
# =============================================================================

# Elenco dei collettori attivi (nomi separati da virgola)
# Testsuite: collettore prometheus (endpoint '/govway/metrics') e due collettori OTLP (push verso il receiver
# di test della webapp TestService, su path differenti), verificati dai test del package 'observability'
observability.collectors=prometheus,otel,otelcustom

# -----------------------------------------------------------------------------
# Default di segnale, validi per TUTTI i collettori (ridefinibili per collettore con
#   observability.collector.<name>.<signal>.<prop>=<value>)
# -----------------------------------------------------------------------------
observability.metrics.enabled=true
#observability.metrics.stepS=60

# Abilitazione delle metriche di sistema (binder JVM/process di default)
observability.metrics.system-metrics.enabled=true

# Bucket SLO degli istogrammi (liste separate da virgola)
observability.metrics.latency-slotMs=5,10,25,50,100,250,500,1000,2500,5000,10000
observability.metrics.size-slotByte=256,1024,4096,16384,65536,262144,1048576,4194304,16777216
# Bucket SLO (ms) per gli istogrammi di persistenza del tracciamento su DB
observability.metrics.persistence-slotMs=5,10,25,50,100,250,500,1000,2500,5000,10000

# -----------------------------------------------------------------------------
# Collettore 'prometheus' (type=prometheus: pull, metriche esposte sull'endpoint '/govway/metrics')
# -----------------------------------------------------------------------------
observability.collector.prometheus.type=prometheus

# -----------------------------------------------------------------------------
# Collettore push OTLP (type=otel), encoding HTTP/protobuf, verso il receiver di test della webapp TestService
# -----------------------------------------------------------------------------
observability.collector.otel.type=otel
observability.collector.otel.metrics.endpoint=http://localhost:8080/TestService/otlp/v1/metrics
# intervallo di invio ridotto per non allungare i tempi dei test
observability.collector.otel.metrics.stepS=5
# Autenticazione Basic verso il collector: viene verificato l'header 'Authorization' ricevuto
observability.collector.otel.metrics.credential.username=otlpUser
observability.collector.otel.metrics.credential.password=otlpPassword

# -----------------------------------------------------------------------------
# Secondo collettore push OTLP, senza autenticazione e con attributi di risorsa personalizzati.
# I valori riferiscono variabili java (risolte tramite la sintassi ${NOME}) dal valore noto anche ai test:
# file.separator='/' e path.separator=':'
# -----------------------------------------------------------------------------
observability.collector.otelcustom.type=otel
observability.collector.otelcustom.metrics.endpoint=http://localhost:8080/TestService/otlp${file.separator}custom/v1/metrics
observability.collector.otelcustom.metrics.stepS=5
observability.collector.otelcustom.resource.service.name=govway${path.separator}testsuite
observability.collector.otelcustom.resource.service.version=1.0-testsuite
observability.collector.otelcustom.resource.service.instance.id=testsuite${file.separator}otelcustom
